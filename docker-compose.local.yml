# SOLO PARA PROBAR EN LOCAL. No se despliega nunca.
#
# El docker-compose.yml de producción no publica ningún puerto a propósito:
# nada de Prometheus debe poder alcanzarse desde fuera del servidor. Pero para
# probarlo en tu máquina hace falta ver su interfaz en el navegador.
#
# Este fichero añade ese puerto SIN tocar el de producción: si se editara el
# principal para probar y se olvidara quitar el "ports:", se publicaría
# Prometheus en el VPS. Con un fichero aparte, producción ni lo ve.
#
# Uso (los dos ficheros, explícitos; no se llama "override" a propósito para
# que Docker no lo cargue por su cuenta sin que se vea):
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Coolify usa solo docker-compose.yml, por lo que este fichero no le afecta.

services:
  prometheus:
    ports:
      # "127.0.0.1:" delante es la parte importante: solo tu propia máquina
      # puede entrar. Sin ello, el puerto quedaría abierto a toda tu red local.
      - "127.0.0.1:9090:9090"

  # Para poder inyectar una alerta de prueba con amtool/curl y comprobar que
  # llega a Telegram (camino Alertmanager -> Telegram), sin depender de que
  # Prometheus dispare nada. Mismo criterio: solo en 127.0.0.1.
  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"

  # En producción Grafana entra por Traefik con HTTPS y no publica ningún puerto.
  # En local no hay Traefik ni HTTPS, así que:
  #  - se publica el 3000 solo en 127.0.0.1 (solo tu máquina);
  #  - ROOT_URL apunta a localhost (si no, los enlaces irían a grafana.paufer.es);
  #  - cookie_secure=false: una cookie "Secure" solo viaja por HTTPS y sin esto
  #    no se podría iniciar sesión en http://localhost:3000.
  # Estas tres cosas NO deben llegar nunca al docker-compose.yml de producción.
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SECURITY_COOKIE_SECURE: "false"
