# Configuración de Prometheus: a QUIÉN pregunta y CON QUÉ frecuencia.
#
# Sin este fichero Prometheus arrancaría y funcionaría perfectamente... sin
# medir nada. Es lo que convierte "tengo un servidor de métricas" en "mido
# estas cosas".
#
# Se monta en el contenedor desde docker-compose.yml (en solo lectura).
# Se valida con: promtool check config prometheus.yml (lo hará el CI).

global:
  # Cada cuánto visita a cada objetivo. 30 s es un equilibrio: más rápido
  # gasta RAM y disco sin que se note en un dashboard; más lento tarda más en
  # detectar una caída. Coincide con el housekeeping_interval de cAdvisor, así
  # nunca lee un dato más viejo que lo que cAdvisor ha recogido.
  scrape_interval: 30s

  # Cada cuánto evalúa las reglas de alerta. Aún no hay reglas (fase 3); se
  # fija ya al mismo ritmo para que, cuando lleguen, se evalúen con cada lectura.
  evaluation_interval: 30s

scrape_configs:

  # Prometheus se mide a sí mismo. Sirve para saber cuánta memoria usa o
  # cuántas series guarda: es lo que dirá si el tope de 256 MB se queda corto.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # El servidor (CPU, RAM, disco, load). "node_exporter" NO es una IP: es el
  # nombre del servicio en docker-compose.yml. Docker crea una red interna
  # donde cada servicio se encuentra por su nombre; si se renombra el servicio
  # en el compose hay que renombrarlo aquí, o Prometheus dejará de encontrarlo.
  # 9100 es el puerto en el que escucha node_exporter de fábrica (EXPOSE de la
  # imagen). Funciona por la red interna: no hace falta "ports:" en el compose.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Los contenedores, uno a uno. cAdvisor escucha en 8080 de fábrica.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Sondas HTTP: comprueba las URLs públicas por fuera, como un usuario.
  # Es distinto de los jobs anteriores. Allí Prometheus preguntaba a un
  # exportador "¿cómo estás?"; aquí le pide a blackbox "comprueba ESTA URL por
  # mí" y la URL viaja como parámetro de la petición.
  #
  # Dos URLs por app: la web (frontend) y el endpoint de salud del backend.
  # Una app nueva NO se vigila sola: hay que añadir sus URLs aquí. Es a
  # propósito, para decidir qué merece alerta (cAdvisor sí descubre
  # contenedores nuevos automáticamente; esto no).
  - job_name: blackbox
    # En vez de /metrics (lo normal) pide /probe, el punto de blackbox que
    # ejecuta una comprobación.
    metrics_path: /probe
    params:
      # La "receta" de blackbox/blackbox.yml. Se añade como ?module=http_2xx
      module: [http_2xx]

    static_configs:
      # OJO: aquí "targets" NO son sitios a los que preguntar sino las URLs
      # que queremos VIGILAR. A quién se pregunta de verdad lo decide el
      # relabel_configs de abajo.
      - targets:
          - https://app.paufer.es
          - https://api.paufer.es/health
          - https://gaston.paufer.es
          - https://api-gaston.paufer.es/health
          - https://multas.paufer.es
          # Multas enruta /api al backend con Traefik, por eso cuelga del
          # mismo dominio y su endpoint de salud se llama /api/v1/salud.
          - https://multas.paufer.es/api/v1/salud

    # Tres reglas, aplicadas en este ORDEN a cada URL. Los nombres con "__"
    # son campos internos que solo existen mientras Prometheus prepara la
    # petición. Resultado, p. ej. para app.paufer.es:
    #   GET http://blackbox_exporter:9115/probe?module=http_2xx&target=https://app.paufer.es
    relabel_configs:
      # 1. Copia la URL al parámetro "target" de la petición.
      - source_labels: [__address__]
        target_label: __param_target
      # 2. Etiqueta la métrica con la URL, para ver en Grafana
      #    "https://app.paufer.es" y no "blackbox_exporter:9115".
      - source_labels: [__param_target]
        target_label: instance
      # 3. Cambia a QUIÉN se contacta de verdad: blackbox, no la web. Va
      #    después de la 1 a propósito: si fuera antes, la regla 1 copiaría
      #    "blackbox_exporter:9115" como target y la URL se perdería.
      - target_label: __address__
        replacement: blackbox_exporter:9115
