# Monitorización del VPS (Paufer, Gast-On, Multas).
#
# Este fichero describe los contenedores que miden y vigilan el servidor.
# Coolify lo clona del repo y lo ejecuta como un recurso más; en local se
# prueba con: docker compose up
#
# Reglas que se aplican a TODO lo de aquí abajo:
#   - Versiones de imagen fijadas, nunca "latest": un redeploy no debe traer
#     una versión distinta sin avisar (así cayó Gast-On el 2026-09-25).
#   - Cada servicio con mem_limit: el VPS tiene 4 GB y sin swap. Si algo se
#     desboca, que muera la monitorización y no el backend de producción.
#   - Sin "ports:" salvo Grafana (vía Traefik): lo que no se publica no se
#     puede atacar desde fuera.

services:

  # ---------------------------------------------------------------------------
  # node_exporter: métricas del SERVIDOR (CPU, RAM, disco, load).
  # Lee del sistema operativo y lo publica en una página interna que Prometheus
  # consulta. Sin él, Prometheus no sabría nada del servidor, solo de
  # contenedores sueltos.
  # ---------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.12.1

    # Si el contenedor cae, Docker lo levanta. A diferencia de "always", si lo
    # paro yo a mano (mantenimiento) no insiste en reiniciarlo.
    restart: unless-stopped

    # Por defecto un contenedor solo ve SUS procesos. Con esto ve los del
    # servidor y puede medirlos. Sin esto mediría únicamente el propio
    # contenedor, que no interesa. Es un permiso amplio, por eso el resto de
    # la configuración es lo más restrictiva posible.
    pid: host

    # Le dice dónde está el sistema de ficheros del servidor DENTRO del
    # contenedor (montado abajo en /host). Sin esto mediría el disco del
    # contenedor, no el del VPS.
    command:
      - --path.rootfs=/host

    volumes:
      # Monta "/" del servidor en /host, en SOLO LECTURA (ro): puede mirar,
      # nunca modificar. "rslave" hace que vea también los discos montados
      # después de arrancar el contenedor.
      - /:/host:ro,rslave

    # Tope duro de memoria. El consumo normal ronda 10-20 MB; 32 MB deja
    # margen sin permitir que crezca sin control.
    mem_limit: 32m

    # NO tiene "ports:" a propósito: nadie fuera de la red del compose puede
    # hablarle. Solo Prometheus, que vive en la misma red.
    #
    # Limitación conocida: al no usar "network_mode: host" (que dejaría el
    # puerto 9100 abierto a internet en el servidor), no veremos el tráfico de
    # las interfaces del servidor. No importa: cAdvisor da la red por contenedor.

  # ---------------------------------------------------------------------------
  # cadvisor: métricas POR CONTENEDOR (CPU, RAM, red, reinicios).
  # node_exporter dice cómo está el servidor en conjunto; cAdvisor dice QUÉ
  # contenedor consume qué, y cuántas veces se ha reiniciado. Es la pieza que
  # habría detectado el bucle de reinicios de Gast-On del 2026-09-25.
  # ---------------------------------------------------------------------------
  cadvisor:
    # En ghcr.io y no en gcr.io: gcr.io ya no publica esta versión (comprobado).
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped

    command:
      # Solo contenedores Docker. Sin esto reporta también cada proceso y
      # cgroup del sistema: miles de métricas que nadie va a mirar.
      - --docker_only=true
      # Cada cuánto recoge datos. Por defecto 1 s; con 30 s (lo mismo que
      # consulta Prometheus) baja mucho el consumo de CPU en un VPS de 2 vCPU.
      - --housekeeping_interval=30s
      # Apaga familias de métricas que no vamos a usar. Menos métricas = menos
      # RAM en Prometheus y menos CPU aquí. Si algún día hacen falta, se quita
      # de esta lista.
      - --disable_metrics=disk,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl

    # cAdvisor mide leyendo cómo el kernel y Docker reparten los recursos.
    # Todo en solo lectura (:ro).
    #
    # AVISO DE SEGURIDAD: montar /var/run da acceso al socket de Docker. El
    # ":ro" solo impide reescribir el fichero del socket; NO limita lo que se
    # puede ordenar a Docker a través de él, que en la práctica equivale a ser
    # administrador del servidor. Es un riesgo conocido y aceptado: es la imagen
    # oficial de Google, con versión fijada, y no se expone a ninguna red
    # pública. Lo que NO hay que hacer nunca es publicar su puerto.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    # Para detectar cuándo el kernel mata un proceso por falta de memoria
    # (OOM kill): justo lo que querrías saber si el VPS se queda sin RAM.
    devices:
      - /dev/kmsg

    # Con ~16 contenedores consume unos 60-100 MB. Es el más hambriento de los
    # exportadores, de ahí el margen respecto a node_exporter.
    mem_limit: 128m

    # Sin "ports:" a propósito, igual que node_exporter.

  # ---------------------------------------------------------------------------
  # blackbox_exporter: comprueba las URLs públicas POR FUERA, como un usuario.
  # A diferencia de node_exporter y cAdvisor (que miran por dentro y NO pueden
  # saber si un usuario recibe un 503), este hace la petición completa y
  # cubre todo el camino: DNS, TLS, Traefik y la aplicación.
  # Prometheus no le pregunta "¿cómo estás?" sino "comprueba ESTA URL por mí":
  # la URL viaja como parámetro (ver prometheus.yml, job blackbox).
  #
  # Limitaciones conocidas, porque corre en el propio VPS:
  #   - Si el VPS entero cae, cae con él (y Prometheus y Alertmanager).
  #   - No prueba que el servidor sea alcanzable desde internet.
  #   Se cubren con un chequeo externo gratuito (UptimeRobot o similar).
  # ---------------------------------------------------------------------------
  blackbox_exporter:
    # La imagen se CONSTRUYE (blackbox/Dockerfile): lleva dentro blackbox.yml.
    # Coolify no deja montar ficheros del repo en un recurso Docker Compose, así
    # que la configuración va horneada en la imagen. La versión fijada está en
    # el FROM del Dockerfile.
    build: ./blackbox
    restart: unless-stopped

    # Sin esta línea usaría los módulos por defecto de la imagen y nuestro
    # blackbox.yml se ignoraría en silencio. La ruta tiene que coincidir con el
    # COPY de blackbox/Dockerfile.
    command:
      - --config.file=/etc/blackbox/blackbox.yml

    # Solo hace peticiones HTTP y devuelve un resultado: muy ligero.
    mem_limit: 32m

    # Escucha en el 9115 de fábrica. Sin "ports:": solo Prometheus llega a él,
    # por la red interna. Sin "depends_on": si arranca antes que blackbox, ese
    # objetivo sale caído unos segundos y se recupera solo.

  # ---------------------------------------------------------------------------
  # prometheus: el cerebro. Cada 30 s visita a cada exportador, lee sus números
  # y los guarda con la hora (modelo "pull": va él a por los datos, los
  # exportadores no necesitan saber que existe, y por eso no hace falta abrir
  # ningún puerto hacia fuera). También evalúa las reglas de alerta.
  # A quién visita se define en prometheus/prometheus.yml.
  # ---------------------------------------------------------------------------
  prometheus:
    # La imagen se CONSTRUYE (prometheus/Dockerfile): lleva dentro
    # prometheus.yml y las reglas. Coolify no deja montar ficheros del repo en
    # un recurso Docker Compose. La versión fijada está en el FROM.
    build: ./prometheus
    restart: unless-stopped

    command:
      # Dónde está su configuración DENTRO del contenedor (la copia el
      # Dockerfile).
      - --config.file=/etc/prometheus/prometheus.yml
      # Dónde guarda los datos (es el volumen prometheus_data, abajo).
      - --storage.tsdb.path=/prometheus
      # Borra datos con más de 15 días: suficiente para ver tendencias y
      # comparar esta semana con la anterior, sin acumular de más.
      - --storage.tsdb.retention.time=15d
      # Red de seguridad: si por lo que sea los datos crecen (más métricas de
      # las previstas), borra los más viejos antes de pasar de 2 GB, en vez de
      # llenar el disco, que es compartido con las bases de datos de las apps.
      # Estimación esperada: ~13 MB/día, ~200 MB en 15 días; 2 GB es un tope
      # 10 veces mayor, no la expectativa. Se confirmará con datos reales.
      - --storage.tsdb.retention.size=2GB
      # --web.enable-lifecycle NO se activa a propósito: permitiría recargar y
      # apagar Prometheus por HTTP, una API que cualquiera con acceso a la red
      # interna podría usar. Para recargar la config se reinicia el contenedor.

    volumes:
      # Solo el volumen de DATOS. La configuración y las reglas ya no se montan:
      # van dentro de la imagen (config-as-code igualmente: para cambiarlas se
      # edita el fichero, se hace commit y se redespliega).
      #
      # Volumen con nombre: sin él, cada redeploy borraría todo el histórico
      # porque los datos vivirían dentro del contenedor, que se destruye al
      # recrearse. OJO: "docker compose down -v" lo borra.
      - prometheus_data:/prometheus

    # El que más memoria necesita de la pila (crece con el número de series).
    # Con lo que medimos debería ir sobrado. Si se queda corto Docker lo
    # reinicia y nos enteraremos por la alerta de reinicios, que es el
    # mecanismo previsto.
    mem_limit: 256m

    # Sin "ports:": a Prometheus lo consulta Grafana por la red interna.

  # ---------------------------------------------------------------------------
  # alertmanager: recibe las alertas de Prometheus y decide QUÉ HACER con ellas:
  # agrupar varias en un solo mensaje, no repetir de más y enviarlas a Telegram.
  # Prometheus decide CUÁNDO hay un problema; este, cómo se avisa de él.
  # Política en alertmanager/alertmanager.yml.
  # ---------------------------------------------------------------------------
  alertmanager:
    # La imagen se CONSTRUYE (alertmanager/Dockerfile): lleva dentro
    # alertmanager.yml. El TOKEN no va en la imagen: se escribe al arrancar
    # (ver entrypoint). La versión fijada está en el FROM.
    build: ./alertmanager
    restart: unless-stopped

    # El token llega como variable de entorno (así lo guarda Coolify) pero
    # alertmanager.yml lo lee de un FICHERO (bot_token_file). Esta envoltura
    # convierte una cosa en la otra al arrancar: lo escribe en /tmp (dentro del
    # contenedor, no persiste) y lanza Alertmanager.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "$$TELEGRAM_BOT_TOKEN" > /tmp/telegram_token &&
        echo "$$TELEGRAM_CHAT_ID" > /tmp/telegram_chat_id &&
        exec /bin/alertmanager
        --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    # Notas del comando (fáciles de equivocar):
    #  - "$$" con doble dólar: un solo "$" lo resolvería Docker Compose ANTES de
    #    arrancar y el token acabaría escrito dentro del comando, visible en
    #    cada "docker inspect" y en los logs. Con "$$" llega literal al
    #    contenedor y lo expande el sh de dentro.
    #  - "exec": sustituye al shell por Alertmanager, que pasa a ser el proceso
    #    principal. Sin él, "docker stop" mandaría la señal al shell, no a
    #    Alertmanager, y tardaría 10 s en morir a la fuerza.

    environment:
      # Aquí sí un solo "$": queremos que el compose la lea de fuera (Coolify o
      # tu terminal) y la pase al contenedor. NUNCA en el repo ni en un .env
      # commiteado. El secret vive en Coolify.
      #
      # ":?" hace la variable OBLIGATORIA: si falta, el despliegue falla en ese
      # momento con este mensaje. Sin ello, Docker Compose solo avisa y usa una
      # cadena vacía: Alertmanager arrancaría "bien", se vería en verde, y no
      # mandaría nunca un mensaje. Un sistema de alertas que falla en silencio
      # es justo lo que NO debe pasar. El CI le pasa un valor ficticio, porque
      # solo valida la estructura y no envía nada.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?falta el secret TELEGRAM_BOT_TOKEN}

      # Tu identificador de conversación con el bot (un número). También
      # obligatorio (":?"): si falta, el despliegue falla en voz alta en vez de
      # arrancar Alertmanager sin saber a quién avisar. Vive en Coolify, no en
      # el repo, porque el repo es público.
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?falta la variable TELEGRAM_CHAT_ID}

    volumes:
      # Guarda los silencios y qué alertas ya se notificaron. Sin él, cada
      # redeploy olvidaría lo avisado y recibirías de nuevo todo lo activo.
      - alertmanager_data:/alertmanager

    # Programa muy ligero: solo enruta mensajes.
    mem_limit: 48m

    # Escucha en el 9093 de fábrica. Sin "ports:": solo Prometheus le habla,
    # por la red interna.

  # ---------------------------------------------------------------------------
  # grafana: los dashboards. No guarda métricas (eso es Prometheus): solo las
  # lee y las dibuja.
  #
  # ES LO ÚNICO DE TODO ESTE STACK ALCANZABLE DESDE INTERNET (por Traefik, en
  # grafana.paufer.es), así que la seguridad pesa aquí más que en cualquier otra
  # pieza: contraseña obligatoria y fuerte, sin registro, sin acceso anónimo,
  # cookie solo por HTTPS y versión con parches recientes.
  # ---------------------------------------------------------------------------
  grafana:
    # La imagen se CONSTRUYE (grafana/Dockerfile): lleva dentro el provisioning
    # y la portada. Coolify no deja montar ficheros del repo en un recurso
    # Docker Compose. La versión fijada y el porqué de la serie 12.4 frente a
    # la 13 (300-320 MB frente a 114-118 MB, medido) están en el FROM del
    # Dockerfile. Es lo único con una puerta a internet: al actualizar, mirar
    # sus avisos de seguridad.
    build: ./grafana
    restart: unless-stopped

    environment:
      # Nombre del administrador. Configurable porque el primer ataque que verá
      # cualquier login público es "admin" con contraseñas comunes; un nombre
      # distinto en Coolify ayuda (poco, pero es gratis).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}

      # Obligatoria (":?"): si falta, el despliegue falla. Sin ella Grafana
      # arrancaría con admin/admin, de dominio público. Es un secret de Coolify,
      # nunca en el repo.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?falta el secret GRAFANA_ADMIN_PASSWORD}

      # Nadie puede crearse una cuenta: sin esto, cualquiera que llegue a la URL
      # se registra.
      GF_USERS_ALLOW_SIGN_UP: "false"

      # Sin acceso sin login. Se fija explícito para que quede escrito aunque el
      # valor por defecto ya sea este.
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      # La URL real. Grafana la usa para enlaces y redirecciones; sin ella
      # apuntarían a localhost:3000.
      GF_SERVER_ROOT_URL: https://grafana.paufer.es

      # La cookie de sesión solo viaja por HTTPS: no se puede robar en una
      # conexión sin cifrar. En local se desactiva (ver docker-compose.local.yaml).
      GF_SECURITY_COOKIE_SECURE: "true"

      # Sin telemetría ni comprobación de actualizaciones: tráfico saliente
      # innecesario desde el VPS.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

      # Apagar lo que NO usamos, medido: Grafana 13 con todo activo llegó a
      # ~200 MB de memoria VIVA (no basura) y rozaba el tope del contenedor.
      #  - Motor de alertas integrado: nuestras alertas las evalúa Prometheus
      #    (prometheus/rules/alerts.yml) y las envía Alertmanager. Tener
      #    además el de Grafana duplicaría el trabajo y la RAM.
      #  - Preinstalación de plugins: por defecto descarga ~18 plugins de
      #    grafana.com al arrancar. Solo usamos el de Prometheus, que ya viene
      #    incluido; así además no hay tráfico saliente al arrancar.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"

      # Techo de memoria para el recolector de basura de Go. Sin esto Go solo
      # limpia cuando el heap se DUPLICA respecto a lo vivo, y en un contenedor
      # con tope duro eso puede llevarlo al OOM antes de limpiar. Con GOMEMLIMIT,
      # Go limpia con más frecuencia al acercarse a este valor. Debe quedar por
      # debajo de mem_limit (~80 %) para dejar margen a lo que no es heap
      # (pilas, mapeos). Con 12.4 el uso real es ~115 MB: esto es solo red de
      # seguridad.
      GOMEMLIMIT: 150MiB

      # Al entrar, Grafana abre directamente la portada (vps.json, generado
      # por grafana/tools/gen_vps_dashboard.py) en vez de su página de
      # bienvenida. La ruta es la del contenedor: la misma carpeta a la que
      # copia los dashboards grafana/Dockerfile.
      # OJO: /etc/grafana/dashboards y no /var/lib/grafana/dashboards. Bajo
      # /var/lib/grafana se monta el volumen grafana_data, que taparía la
      # portada de la imagen (ver el comentario del COPY en grafana/Dockerfile).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vps.json

      # Tema oscuro por defecto: es el que mejor hace destacar el rojo y el
      # verde de los estados, que es el único color con significado aquí. Cada
      # usuario puede cambiarlo en su perfil.
      GF_USERS_DEFAULT_THEME: dark

    volumes:
      # Su base de datos (SQLite): usuarios y preferencias. Sin él, cada
      # redeploy te devolvería a cero.
      # SOLO lo que Grafana ESCRIBE va aquí. Nada de lo que le damos (provisioning,
      # dashboards) puede estar bajo /var/lib/grafana: este volumen lo taparía.
      - grafana_data:/var/lib/grafana
      # El provisioning y los dashboards ya NO se montan: van dentro de la
      # imagen (grafana/Dockerfile). Lo que se cambie a mano en la interfaz se
      # pierde igualmente en el siguiente despliegue: limitación consciente a
      # cambio de que todo sea reproducible desde el repo.

    # MEDIDO en local (2026-10-15), Grafana 12.4.13 con el motor de alertas y
    # la preinstalación de plugins apagados: 114 MB en reposo y 114-118 MB tras
    # 7 rondas de las 12 consultas de la portada. 192 MB deja ~75 MB de margen.
    # (Con la 13.2.4 el mismo test llegó a 320 MB y rozó el tope: ver la nota de
    # la imagen.) La suma de topes de todo el stack queda en ~690 MB sobre
    # ~1500 MB disponibles en el VPS. Revisar con datos reales del VPS.
    mem_limit: 192m

    # Sin "ports:": entra por Traefik, que es quien habla con internet. Estos
    # labels son los mismos que usan Paufer, Gast-On y Multas (router, HTTPS,
    # Let's Encrypt y puerto interno 3000, el de fábrica de Grafana).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.paufer.es`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
